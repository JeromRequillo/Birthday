<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Tracker | Requillo</title>
<meta name="description" content="A real-time birthday tracker and greeting page for family and friends, with a celebration spotlight for every celebrant.">
<meta name="theme-color" content="#4a90e2">
<meta property="og:type" content="website">
<meta property="og:title" content="Birthday Tracker | Requillo">
<meta property="og:description" content="Never miss a wish. Never miss a party.">
<meta property="og:image" content="https://jeromrequillo.github.io/Birthday/assets/og-image.png">
<meta property="og:url" content="https://jeromrequillo.github.io/Birthday/">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="assets/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="assets/icons/icon-192.png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@400;600;700&family=Pacifico&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/tarpaulin.css">
<script src="js/boot.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>
<div class="cloud"></div><div class="cloud"></div><div class="cloud"></div>

<dialog id="edit-dialog">
  <form id="edit-form">
    <h3>Edit birthday</h3>
    <label for="edit-name">Name</label><input type="text" id="edit-name" maxlength="60" required>
    <label for="edit-date">Date</label><span class="dfield" id="edit-datefield"><input type="date" id="edit-date"><span class="md" hidden><select class="m" aria-label="Month"><option value="">Month</option></select><select class="d" aria-label="Day"><option value="">Day</option></select></span><label class="noyr"><input type="checkbox"> Year unknown</label></span>
    <label for="edit-tag">Group</label>
    <select id="edit-tag"><option>Family</option><option>Friends</option><option>Others</option></select>
    <div class="row"><button type="button" class="cancel" id="edit-cancel">Cancel</button><button type="submit">Save changes</button></div>
  </form>
</dialog>

<header>
  <div class="author-tag">Developer:<br>JEROM REQUILLO</div>
  <div class="tools">
    <button class="ghost" id="cal-btn" title="Download all birthdays as a calendar file">📅 Calendar</button>
    <button class="ghost" id="spot-btn">🎂 Spotlight</button>
    <button class="ghost" id="theme-btn" aria-label="Toggle theme">🌙</button>
    <button class="ghost" id="auth-btn">Admin login</button>
  </div>
  <h1>Birthday Tracker / Greeting Page</h1>
  <p class="subtitle" id="hero-subtitle">🎂 My Family &amp; Friends Birthday Wall</p>
</header>

<div class="container">
  <div class="sticky-note">
    <h3>⭐ HAPPY BIRTHDAY</h3>
    <p id="quote"></p>
  </div>

  <div class="main-card">
    <h2>Birthdays 🥳</h2>
    <p id="current-month-text"></p>
    <div id="today-card" class="today-card" hidden></div>
    <button id="next-card" class="next-card" hidden></button>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="month" aria-selected="true">This month</button>
      <button class="tab" role="tab" data-tab="soon" aria-selected="false">Next 30 days</button>
      <button class="tab" role="tab" data-tab="all" aria-selected="false">All</button>
    </div>
    <div class="filters" id="filters">
      <input type="search" id="search" placeholder="Search by name" aria-label="Search by name">
      <select id="tag-filter" aria-label="Filter by group"><option value="all">All groups</option><option>Family</option><option>Friends</option><option>Others</option></select>
    </div>
    <div id="birthday-list" aria-live="polite"></div>

    <div id="admin-area">
      <h4>Add a birthday</h4>
      <div class="add-form">
        <input type="text" id="nameInput" placeholder="Name" maxlength="60" aria-label="Name">
        <span class="dfield" id="add-date"><input type="date" id="dateInput" aria-label="Date of birth"><span class="md" hidden><select class="m" aria-label="Month"><option value="">Month</option></select><select class="d" aria-label="Day"><option value="">Day</option></select></span><label class="noyr"><input type="checkbox"> Year unknown</label></span>
        <select id="tagInput" aria-label="Group"><option>Family</option><option>Friends</option><option>Others</option></select>
        <button id="add-btn">Add birthday</button>
      </div>
    </div>
  </div>
</div>

<div class="cloud-footer">✨ <strong>“Where every special day is remembered and celebrated.”</strong> Never miss a wish. Never miss a party.</div>
<div id="spot" hidden><div class="tarp" id="tarp"></div><button id="spot-close">See all birthdays</button></div>
<div id="toast" role="status"></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
