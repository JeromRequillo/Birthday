<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Tracker | Requillo</title>
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@400;600;700&family=Pacifico&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<script>
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
  try { const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<style>
:root{--bg1:#4a90e2;--bg2:#87ceeb;--card:#fff;--text:#2b2f36;--muted:#5f6672;--note:#fff9c4;--note-text:#333;--accent:#d6336c;--accent-h:#b82a5b;--line:#e3e8ef;--item:#f5f9ff;--cloud:#f0f8ff;--cloud-o:.8;--sun:rgba(255,236,160,.6);--friends:#2f6fc4;--others:#2e7d32;--ok:#2e7d32;--bad:#c62828}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#0f1b33;--bg2:#1d3557;--card:#1c2433;--text:#e8ecf3;--muted:#a3adbd;--note:#3d3a1f;--note-text:#f6f0b8;--accent:#e8588d;--accent-h:#f06fa0;--line:#2f3a50;--item:#232d40;--cloud-o:.1;--sun:rgba(140,160,255,.2);--friends:#7db3ff;--others:#8bd18f;--ok:#66bb6a;--bad:#ef6c6c}}
:root[data-theme="dark"]{--bg1:#0f1b33;--bg2:#1d3557;--card:#1c2433;--text:#e8ecf3;--muted:#a3adbd;--note:#3d3a1f;--note-text:#f6f0b8;--accent:#e8588d;--accent-h:#f06fa0;--line:#2f3a50;--item:#232d40;--cloud-o:.1;--sun:rgba(140,160,255,.2);--friends:#7db3ff;--others:#8bd18f;--ok:#66bb6a;--bad:#ef6c6c}
*{box-sizing:border-box}
body{margin:0;font-family:'Quicksand',sans-serif;background:radial-gradient(circle at 88% 6%,var(--sun),transparent 38%),linear-gradient(to bottom,var(--bg1),var(--bg2));background-attachment:fixed;min-height:100vh;color:var(--text);overflow-x:hidden;display:flex;flex-direction:column;align-items:center}
.cloud{position:absolute;background:var(--cloud);border-radius:50%;opacity:var(--cloud-o);animation:float 20s infinite linear;z-index:0}
.cloud:nth-child(1){width:100px;height:60px;top:10%;left:10%;animation-delay:0s}
.cloud:nth-child(2){width:150px;height:90px;top:20%;right:15%;animation-delay:5s}
.cloud:nth-child(3){width:80px;height:50px;top:60%;left:20%;animation-delay:10s}
@keyframes float{0%{transform:translateX(-100vw)}100%{transform:translateX(100vw)}}
header{width:100%;padding:20px;text-align:center;color:#fff;position:relative;z-index:1}
.author-tag{background:var(--note);color:var(--note-text);padding:5px 15px;display:inline-block;box-shadow:2px 2px 5px rgba(0,0,0,.2);font-weight:700;position:absolute;left:20px;top:20px;transform:rotate(-5deg);animation:wiggle 2s infinite}
@keyframes wiggle{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
.tools{position:absolute;right:20px;top:20px;display:flex;gap:8px}
h1{font-family:'Fredoka One',cursive;font-size:2.4rem;margin:50px 0 5px;text-shadow:2px 2px 4px rgba(0,0,0,.3)}
.subtitle{font-style:italic;margin:0 0 10px;animation:fadeIn 2s ease-in}
@keyframes fadeIn{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:translateY(0)}}
button{font:inherit;padding:8px 15px;background:var(--accent);color:#fff;border:none;border-radius:6px;cursor:pointer;transition:background .2s}
button:hover{background:var(--accent-h)}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #ffd700;outline-offset:2px}
.ghost{background:rgba(255,255,255,.22);padding:6px 12px;font-size:.85rem}
.ghost:hover{background:rgba(255,255,255,.38)}
.container{display:flex;gap:30px;padding:20px;max-width:1000px;width:100%;align-items:flex-start;position:relative;z-index:1}
.sticky-note{background:var(--note);color:var(--note-text);padding:25px;width:300px;flex-shrink:0;transform:rotate(-2deg);box-shadow:5px 5px 15px rgba(0,0,0,.25);position:relative;transition:transform .3s ease}
.sticky-note:hover{transform:rotate(0deg) scale(1.05)}
.sticky-note::before{content:"📌";position:absolute;top:-10px;left:50%;transform:translateX(-50%)}
.sticky-note h3{margin-top:0}.sticky-note ul{padding-left:18px;line-height:1.5}
.btn-github{transition:background .3s ease;display:inline-block;margin-top:10px;background:#24292e;color:#fff;padding:8px 14px;border-radius:6px;text-decoration:none;font-size:.85rem}
.btn-github:hover{background:#444}
.main-card{background:var(--card);flex:1;min-width:0;padding:25px;border-radius:14px;box-shadow:0 8px 25px rgba(0,0,0,.2);animation:slideUp 1s ease-out}
@keyframes slideUp{from{opacity:0;transform:translateY(50px)}to{opacity:1;transform:translateY(0)}}
.main-card h2{margin:0 0 4px}#current-month-text{color:var(--muted);margin:0 0 14px}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tab{background:var(--item);color:var(--text);border:1px solid var(--line)}
.tab:hover{background:var(--line)}
.tab[aria-selected="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
.filters{display:flex;gap:8px;margin-bottom:12px}
input,select{padding:9px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--text);font:inherit;min-width:0}
.filters input{flex:1}
.birthday-item{display:flex;align-items:center;gap:12px;padding:12px 14px;margin-bottom:8px;background:var(--item);border-radius:10px;border-left:5px solid var(--bg1);transition:background-color .3s ease}
.birthday-item:hover{background:var(--line)}
.birthday-item.today{border:2px solid #ffd700;background:var(--note);color:var(--note-text);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.02)}}
.birthday-item.done{opacity:.65}
.info{flex:1;min-width:0}.info strong{display:block;overflow-wrap:anywhere}
.sub{font-size:.85rem;color:var(--muted)}.today .sub{color:inherit}
.chip{display:inline-block;font-size:.72rem;padding:1px 8px;border-radius:20px;border:1px solid var(--line);margin-left:6px;vertical-align:middle}
.when{text-align:right;font-weight:700;white-space:nowrap}
.when small{display:block;font-weight:400;color:var(--muted)}.today .when small{color:inherit}
.actions{display:none;gap:6px}.is-admin .actions{display:flex}
.actions button{padding:5px 10px;font-size:.8rem}
.edit-btn{background:var(--ok)}.delete-btn{background:var(--bad)}
.empty{text-align:center;padding:30px;color:var(--muted)}.empty .big{font-size:3rem;margin:0}
#admin-area{display:none;border-top:1px solid var(--line);margin-top:18px;padding-top:12px}.is-admin #admin-area{display:block}
.add-form{display:flex;gap:10px;flex-wrap:wrap}.add-form input[type=text]{flex:1;min-width:140px}
dialog{border:none;border-radius:12px;padding:22px;background:var(--card);color:var(--text);box-shadow:0 10px 30px rgba(0,0,0,.4);width:min(340px,90vw)}
dialog::backdrop{background:rgba(0,0,0,.55)}
dialog h3{margin-top:0}dialog label{display:block;margin:10px 0 4px;font-size:.85rem}dialog input,dialog select{width:100%}
.row{display:flex;gap:8px;margin-top:16px;justify-content:flex-end}.cancel{background:var(--muted)}
.err{color:var(--bad);font-size:.85rem;min-height:1.1em;margin:8px 0 0}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:30px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:2000;max-width:90vw}
#toast.show{opacity:1}
.cloud-footer{position:relative;z-index:1;margin:10px 20px 30px;background:rgba(255,255,255,.85);color:#333;padding:10px 20px;border-radius:50px;font-size:.9rem;text-align:center;box-shadow:0 5px 15px rgba(0,0,0,.1);animation:bounce 2s infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
#quote{transition:opacity .3s ease;font-size:1.15rem;font-style:italic;line-height:1.5;margin:0}
/* spotlight tarpaulin */
#spot{position:fixed;inset:0;z-index:900;overflow:auto;display:flex;padding:24px 12px 96px;background:#1f49b3}
#spot[hidden]{display:none}
#spot::before{content:"";position:fixed;inset:-60%;background:repeating-conic-gradient(#2a5bd7 0 6deg,#1c3fa0 6deg 12deg);animation:spin 90s linear infinite;z-index:0}
#spot::after{content:"";position:fixed;inset:0;background:radial-gradient(circle at 50% 40%,rgba(255,255,255,.35),transparent 55%);z-index:0;pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}
.balloon{position:fixed;bottom:-90px;left:var(--x);font-size:var(--s);z-index:1;pointer-events:none;animation:rise var(--d) linear infinite;animation-delay:var(--w)}
@keyframes rise{0%{transform:translateY(0) rotate(-8deg)}50%{transform:translateY(-60vh) rotate(8deg)}100%{transform:translateY(-130vh) rotate(-8deg)}}
.tarp{position:relative;z-index:2;margin:auto;width:min(960px,94vw);padding:clamp(28px,5vw,60px) clamp(18px,4vw,50px);border-radius:20px;background:linear-gradient(160deg,#ff3d7f,#9b2ff0 55%,#3a63e0);border:10px solid #fff;box-shadow:0 0 0 6px #ffd700,0 30px 70px rgba(0,0,0,.55);text-align:center;color:#fff;animation:tarpIn .9s cubic-bezier(.2,1.3,.4,1)}
@keyframes tarpIn{from{opacity:0;transform:scale(.7) rotate(-3deg)}to{opacity:1;transform:none}}
.gr{position:absolute;width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#9aa0a8);box-shadow:inset 0 0 0 3px #c7ccd3,0 1px 3px rgba(0,0,0,.5)}
.g1{top:8px;left:8px}.g2{top:8px;right:8px}.g3{bottom:8px;left:8px}.g4{bottom:8px;right:8px}
.tp-script{font-family:'Pacifico',cursive;font-size:clamp(2rem,8vw,4.4rem);color:#ffe14d;text-shadow:0 4px 0 #b3002f,0 10px 22px rgba(0,0,0,.4);line-height:1.25}
.tp-name{font-family:'Fredoka One',cursive;font-weight:400;margin:6px 0 0;line-height:1.05;color:#fff;letter-spacing:1px;text-shadow:0 6px 0 #1b1464,0 14px 28px rgba(0,0,0,.45);overflow-wrap:anywhere}
.tp-age{position:relative;isolation:isolate;margin:34px auto 28px;width:clamp(120px,24vmin,190px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3a0,#ffc400 60%,#ff9100);color:#5a0030;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(0,0,0,.4);line-height:1}
.tp-age::before{content:"";position:absolute;inset:-22px;border-radius:50%;z-index:-1;background:repeating-conic-gradient(#ffd700 0 9deg,transparent 9deg 18deg);animation:spin 16s linear infinite}
.tp-age b{font-family:'Fredoka One',cursive;font-weight:400;font-size:clamp(3rem,13vmin,5.5rem)}
.tp-age small{font-weight:700;font-size:clamp(.8rem,2.4vmin,1.1rem);margin-top:4px}
.tp-ribbon{display:inline-block;max-width:100%;background:#ffd700;color:#5a0030;font-weight:700;padding:12px clamp(30px,6vw,64px);clip-path:polygon(0 0,100% 0,96% 50%,100% 100%,0 100%,4% 50%);font-size:clamp(.95rem,2.6vw,1.3rem)}
.tp-tag{display:block;margin-top:16px;font-weight:700;opacity:.9}
.tp-dots{display:flex;gap:8px;justify-content:center;margin-top:18px}
.tp-dots button{width:14px;height:14px;padding:0;border-radius:50%;background:rgba(255,255,255,.45)}
.tp-dots button.on{background:#ffd700}
#spot-close{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:5;background:#fff;color:#5a0030;font-weight:700;padding:12px 26px;border-radius:999px;box-shadow:0 8px 20px rgba(0,0,0,.35)}
#spot-close:hover{background:#ffe14d}
.spot-row{background:#7b2ff7;padding:6px 12px;font-size:.8rem}
.spot-row:hover{background:#6420d4}
.tp-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-top:22px}
.tp-card{background:rgba(255,255,255,.96);color:#5a0030;border-radius:16px;padding:18px 12px;display:flex;flex-direction:column;gap:4px;box-shadow:0 6px 0 #1b1464,0 12px 24px rgba(0,0,0,.35);transition:transform .2s ease,background .2s ease}
.tp-card:hover{background:#ffe14d;transform:translateY(-4px) rotate(-1deg)}
.tp-card strong{font-family:'Fredoka One',cursive;font-weight:400;font-size:clamp(1.3rem,3.4vw,2rem);overflow-wrap:anywhere}
.tp-hint{margin:20px 0 0;font-weight:600}
.tp-back{margin-top:22px;background:rgba(255,255,255,.2);border:2px solid #fff}
.tp-back:hover{background:rgba(255,255,255,.35)}
.next-card{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:8px 14px;margin-bottom:14px;border-radius:12px;background:var(--item);color:var(--text);border:1px solid var(--line);font-size:.9rem;transition:background .2s}
.next-card:hover{background:var(--line)}
.next-card[hidden],.filters[hidden],.today-card[hidden]{display:none}
.nc-emoji{font-size:1.2rem}
.today-card{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;padding:24px 28px;margin-bottom:18px;border-radius:22px;background:linear-gradient(135deg,#ffd700,#ff8f00 55%,#ff3d7f);color:#4a0d2b;box-shadow:0 0 0 4px #fff,0 14px 34px rgba(255,143,0,.55);animation:pulse 1.6s ease-in-out infinite}
.tc-text{display:flex;flex-direction:column;gap:2px;min-width:0}
.tc-label{font-weight:700;font-size:.95rem}
.tc-name{font-family:'Fredoka One',cursive;font-weight:400;font-size:clamp(2rem,7vw,3.4rem);line-height:1.05;overflow-wrap:anywhere;text-shadow:0 2px 0 rgba(255,255,255,.5)}
.tc-sub{font-weight:700;font-size:1.1rem}
.tc-btns{display:flex;gap:10px;flex-wrap:wrap}
.tc-spot{background:#5a0030;color:#fff;font-weight:700;padding:12px 22px;border-radius:999px;font-size:1rem}
.tc-spot:hover{background:#3d0020}
.tc-greet{background:#fff;color:#5a0030;font-weight:700;padding:12px 22px;border-radius:999px;font-size:1rem}
.tc-greet:hover{background:#ffe14d}
.birthday-item.today{padding:16px 18px;box-shadow:0 0 0 3px #ffd700,0 10px 24px rgba(255,179,0,.4)}
.today .info strong{font-size:1.2rem}
.today .tile{width:62px;height:66px}
.greet-row{background:#1f8a4c;padding:6px 12px;font-size:.8rem}
.greet-row:hover{background:#176d3c}
.tp-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:22px}
.tp-actions button{margin:0}
.tp-greet{background:#fff;color:#5a0030;font-weight:700;padding:10px 22px;border-radius:999px}
.tp-greet:hover{background:#ffe14d}
/* polish */
h1{font-size:3rem;letter-spacing:.5px;text-shadow:0 2px 0 rgba(0,0,0,.12),0 6px 18px rgba(0,0,0,.28)}
.subtitle{display:inline-block;background:rgba(255,255,255,.2);backdrop-filter:blur(6px);padding:6px 18px;border-radius:999px;border:1px solid rgba(255,255,255,.35)}
.ghost{backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.35)}
.main-card{border-radius:26px;border:1px solid rgba(255,255,255,.45);box-shadow:0 18px 40px rgba(10,30,70,.28);padding:28px}
.main-card h2{font-family:'Fredoka One',cursive;font-size:1.8rem;font-weight:400}
.sticky-note li{margin-bottom:8px}.sticky-note li:last-child{margin-bottom:0}
.tabs{background:var(--item);padding:4px;border-radius:999px;display:inline-flex;gap:2px}
.tab{background:transparent;border:none;color:var(--muted);border-radius:999px;padding:8px 16px;font-weight:600}
.tab:hover{background:transparent;color:var(--text)}
.tab[data-tab="all"]{display:none}body.is-admin .tab[data-tab="all"]{display:inline-block}
.tab[aria-selected="true"]{background:var(--accent);color:#fff;box-shadow:0 4px 10px rgba(214,51,108,.35)}
input,select{border-radius:10px;padding:10px 12px}
input:focus,select:focus{border-color:var(--accent)}
.birthday-item{border:2px solid transparent;border-radius:16px;padding:12px 14px;gap:14px;box-shadow:0 1px 3px rgba(0,0,0,.06);transition:transform .2s ease,box-shadow .2s ease,background-color .3s ease}
.birthday-item:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(10,30,70,.15)}
.birthday-item.today{background:linear-gradient(135deg,var(--note),var(--item))}
.tile{width:54px;height:58px;flex-shrink:0;border-radius:14px;background:linear-gradient(160deg,var(--bg1),#2f6fc4);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;box-shadow:0 4px 10px rgba(47,111,196,.35)}
.tm{font-size:.72rem;font-weight:700;opacity:.9;margin-bottom:3px}.td{font-family:'Fredoka One',cursive;font-size:1.5rem}
.today .tile{background:linear-gradient(160deg,#ffd700,#ffb300);color:#4a3b00;box-shadow:0 4px 10px rgba(255,179,0,.5)}
.done .tile{filter:grayscale(.7)}
.when{background:var(--line);padding:5px 12px;border-radius:999px;font-size:.85rem}
.today .when{background:var(--accent);color:#fff}
.chip{border:none;font-weight:600}
.c-Family{background:rgba(214,51,108,.14);color:var(--accent)}
.c-Friends{background:rgba(47,111,196,.15);color:var(--friends)}
.c-Others{background:rgba(46,125,50,.15);color:var(--others)}
.empty .big{font-size:3.5rem}
.cloud-footer{backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.5)}
/* celebrant animations */
@keyframes glow{0%,100%{box-shadow:0 0 0 3px #ffd700,0 0 0 0 rgba(255,215,0,0)}50%{box-shadow:0 0 0 3px #ffd700,0 0 28px 10px rgba(255,215,0,.8)}}
@keyframes cardGlow{0%,100%{box-shadow:0 0 0 4px #fff,0 14px 34px rgba(255,143,0,.55)}50%{box-shadow:0 0 0 4px #fff,0 0 46px 16px rgba(255,215,0,.9)}}
@keyframes shine{0%{left:-60%}60%,100%{left:130%}}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.birthday-item.today{animation:pulse 1.2s ease-in-out infinite,glow 1.6s ease-in-out infinite}
.today .tile{animation:hop 1s ease-in-out infinite}
.today-card{position:relative;overflow:hidden;animation:pulse 1.6s ease-in-out infinite,cardGlow 2s ease-in-out infinite}
.today-card>*{position:relative}
.today-card::before{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.6),transparent);transform:skewX(-20deg);animation:shine 2.6s ease-in-out infinite}
@media(max-width:768px){
 h1{font-size:2.1rem}.tabs{display:flex;overflow-x:auto}.tab{padding:8px 12px;font-size:.85rem;white-space:nowrap}
 .container{flex-direction:column;align-items:center;gap:20px;padding:12px}
 .sticky-note{width:92%;max-width:420px;transform:none}.main-card{width:100%;padding:18px}
 .author-tag{position:static;display:block;transform:none;animation:none;margin-bottom:10px}
 .tools{position:static;justify-content:center;margin-bottom:6px}
 h1{font-size:1.9rem;margin-top:10px}
 .birthday-item{flex-wrap:wrap}.actions{width:100%}.add-form button{width:100%}
}

</style>
</head>
<body>
<div class="cloud"></div><div class="cloud"></div><div class="cloud"></div>

<dialog id="edit-dialog">
  <form id="edit-form">
    <h3>Edit birthday</h3>
    <label for="edit-name">Name</label><input type="text" id="edit-name" maxlength="60" required>
    <label for="edit-date">Date</label><input type="date" id="edit-date" required>
    <label for="edit-tag">Group</label>
    <select id="edit-tag"><option>Family</option><option>Friends</option><option>Others</option></select>
    <div class="row"><button type="button" class="cancel" id="edit-cancel">Cancel</button><button type="submit">Save changes</button></div>
  </form>
</dialog>

<header>
  <div class="author-tag">Developer:<br>JEROM REQUILLO</div>
  <div class="tools">
    <button class="ghost" id="spot-btn">🎂 Spotlight</button>
    <button class="ghost" id="theme-btn" aria-label="Toggle theme">🌙</button>
    <button class="ghost" id="auth-btn">Admin login</button>
  </div>
  <h1>Birthday Tracker / Greeting Page</h1>
  <p class="subtitle" id="hero-subtitle">🎂 My Family &amp; Friends Birthday Wall</p>
</header>

<div class="container">
  <div class="sticky-note">
    <h3>⭐ HAPPY BIRTHDAY</h3>
    <p id="quote"></p>
  </div>

  <div class="main-card">
    <h2>Birthdays 🥳</h2>
    <p id="current-month-text"></p>
    <div id="today-card" class="today-card" hidden></div>
    <button id="next-card" class="next-card" hidden></button>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="month" aria-selected="true">This month</button>
      <button class="tab" role="tab" data-tab="soon" aria-selected="false">Next 30 days</button>
      <button class="tab" role="tab" data-tab="all" aria-selected="false">All</button>
    </div>
    <div class="filters" id="filters">
      <input type="search" id="search" placeholder="Search by name" aria-label="Search by name">
      <select id="tag-filter" aria-label="Filter by group"><option value="all">All groups</option><option>Family</option><option>Friends</option><option>Others</option></select>
    </div>
    <div id="birthday-list" aria-live="polite"></div>

    <div id="admin-area">
      <h4>Add a birthday</h4>
      <div class="add-form">
        <input type="text" id="nameInput" placeholder="Name" maxlength="60" aria-label="Name">
        <input type="date" id="dateInput" aria-label="Date of birth">
        <select id="tagInput" aria-label="Group"><option>Family</option><option>Friends</option><option>Others</option></select>
        <button id="add-btn">Add birthday</button>
      </div>
    </div>
  </div>
</div>

<div class="cloud-footer">✨ <strong>“Where every special day is remembered and celebrated.”</strong> Never miss a wish. Never miss a party.</div>
<div id="spot" hidden><div class="tarp" id="tarp"></div><button id="spot-close">See all birthdays</button></div>
<div id="toast" role="status"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
import { getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot, updateDoc } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyCRl2LQBqPUc7uCqJp6sSwPSF6o-9dKb9w",
  authDomain: "birthday-tracker-dff7f.firebaseapp.com",
  projectId: "birthday-tracker-dff7f",
  storageBucket: "birthday-tracker-dff7f.firebasestorage.app",
  messagingSenderId: "796866393410",
  appId: "1:796866393410:web:c548cf89c5df9cb9ef04db",
  measurementId: "G-7TPQ3R4JTP"
});
const db = getFirestore(app);
let auth = null, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged;
try {
  const a = await import("https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js");
  ({ signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } = a);
  auth = a.getAuth(app);
} catch (e) { console.error("Auth unavailable:", e); }
const col = collection(db, "birthdays");

const $ = id => document.getElementById(id);
const el = (t, c, txt) => { const e = document.createElement(t); if (c) e.className = c; if (txt != null) e.textContent = txt; return e; };
const ls = { get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} } };
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const isLeap = y => (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0;
const occurrence = (y, m, d) => (m === 2 && d === 29 && !isLeap(y)) ? new Date(y, 2, 1) : new Date(y, m - 1, d);

let items = [], tab = "month", firstLoad = true, editId = null;

function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 3000); }

/* ---------- data ---------- */
function compute() {
  const n = new Date(), today = new Date(n.getFullYear(), n.getMonth(), n.getDate());
  return items.filter(b => /^\d{4}-\d{2}-\d{2}$/.test(b.date || "")).map(b => {
    const [y, m, d] = b.date.split("-").map(Number);
    let yr = today.getFullYear(), occ = occurrence(yr, m, d);
    if (occ < today) { yr++; occ = occurrence(yr, m, d); }
    const days = Math.round((occ - today) / 864e5), turns = yr - y;
    return { ...b, y, m, d, days, turns, age: days === 0 ? turns : turns - 1, tag: b.tag || "Others" };
  });
}

function view(all) {
  const n = new Date(), q = $("search").value.trim().toLowerCase(), tg = $("tag-filter").value;
  let list = all.filter(b => (!q || (b.name || "").toLowerCase().includes(q)) && (tg === "all" || b.tag === tg));
  if (tab === "month") list = list.filter(b => b.m === n.getMonth() + 1).sort((a, b) => (b.days === 0) - (a.days === 0) || a.d - b.d);
  else if (tab === "soon") list = list.filter(b => b.days <= 30).sort((a, b) => a.days - b.days);
  else list = list.sort((a, b) => a.days - b.days);
  return list;
}

/* ---------- render ---------- */
function render() {
  const all = compute(), list = view(all), box = $("birthday-list"), n = new Date();
  box.replaceChildren();
  $("current-month-text").textContent = `Happy birthday to all celebrants this ${MONTHS[n.getMonth()]}!`;

  list.forEach(b => {
    const passed = tab === "month" && b.d < n.getDate();
    const row = el("div", "birthday-item" + (b.days === 0 ? " today" : "") + (passed ? " done" : ""));
    const info = el("div", "info"), nm = el("strong", null, (b.days === 0 ? "🎂 " : "") + b.name);
    nm.appendChild(el("span", "chip c-" + b.tag, b.tag));
    const sub = b.days === 0 ? `Turns ${b.turns} today!` : passed ? `${b.age} years old` : `Turning ${b.turns}`;
    info.append(nm, el("span", "sub", sub));
    const when = el("div", "when", b.days === 0 ? "Today! 🎉" : passed ? "Done ✓" : b.days === 1 ? "Tomorrow!" : `${b.days} days`);
    const tile = el("div", "tile");
    tile.append(el("span", "tm", MONTHS[b.m - 1].slice(0, 3)), el("span", "td", String(b.d)));
    const act = el("div", "actions");
    const eb = el("button", "edit-btn", "Edit"), db_ = el("button", "delete-btn", "Delete");
    const sb = el("button", "spot-row", "Spotlight");
    sb.addEventListener("click", () => openSpot([b]));
    const gb = el("button", "greet-row", "Greet");
    gb.addEventListener("click", () => greet(b));
    eb.addEventListener("click", () => openEdit(b));
    db_.addEventListener("click", () => remove(b));
    act.append(eb, db_);
    row.append(tile, info, when, sb, gb, act);
    box.appendChild(row);
  });

  if (!list.length) {
    const msgs = { month: `No birthdays in ${MONTHS[n.getMonth()]}.`, soon: "No birthdays in the next 30 days.", all: "No birthdays listed yet." };
    const e = el("div", "empty");
    e.append(el("p", "big", "🎈"), el("p", null, ($("search").value || $("tag-filter").value !== "all") ? "No matches found." : msgs[tab]));
    box.appendChild(e);
  }
  subtitle(all);
  $("filters").hidden = all.length <= 10;
  todayCard(all);
  nextCard(all);
}

function subtitle(all) {
  const s = $("hero-subtitle");
  if (!all.length) return;
  const sorted = [...all].sort((a, b) => a.days - b.days), today = sorted.filter(b => b.days === 0);
  if (today.length) s.textContent = `🎉 Happy birthday, ${today.map(b => b.name).join(" and ")}!`;
  else { const nx = sorted[0]; s.textContent = `🎂 Next: ${nx.name}, ${nx.days === 1 ? "tomorrow" : `in ${nx.days} days`}!`; }
}

/* ---------- quote, next card, greeting ---------- */
const QUOTES = ["“Hope all your birthday wishes come true!”", "“It’s your special day, so get out there and celebrate!”", "“I hope your celebration gives you many happy memories!”", "“Happy birthday! Here’s to more life, love, and adventures to come!”", "“Wishing you a birthday that’s just as wonderful as you are!”"];
let qi = Math.floor(Date.now() / 6e4) % QUOTES.length;
const quoteEl = $("quote");
quoteEl.textContent = QUOTES[qi];
setInterval(() => {
  qi = (qi + 1) % QUOTES.length;
  quoteEl.style.opacity = 0;
  setTimeout(() => { quoteEl.textContent = QUOTES[qi]; quoteEl.style.opacity = 1; }, 300);
}, 60000);

function nextCard(all) {
  const c = $("next-card"), up = all.filter(b => b.days > 0);
  if (!up.length) { c.hidden = true; return; }
  const min = Math.min(...up.map(b => b.days)), group = up.filter(b => b.days === min), f = group[0];
  const line = el("span", "nc-line");
  line.append("Next birthday: ", el("strong", null, group.map(x => x.name).join(", ")), `, ${min === 1 ? "tomorrow" : `in ${min} days`} (${MONTHS[f.m - 1]} ${f.d})`);
  c.replaceChildren(el("span", "nc-emoji", "🎂"), line);
  c.hidden = false;
  c.onclick = () => openSpot(group);
}

function todayCard(all) {
  const c = $("today-card"), t = all.filter(b => b.days === 0);
  if (!t.length) { c.hidden = true; return; }
  const txt = el("div", "tc-text"), btns = el("div", "tc-btns");
  txt.append(el("span", "tc-label", t.length > 1 ? "Today’s celebrants" : "Today’s celebrant"),
    el("strong", "tc-name", t.map(b => b.name).join(" and ")),
    el("span", "tc-sub", t.length > 1 ? "Happy birthday to all! 🎉" : `Turns ${t[0].turns} today! 🎉`));
  const sp = el("button", "tc-spot", "🎂 Open spotlight");
  sp.addEventListener("click", () => openSpot(t));
  btns.appendChild(sp);
  if (t.length === 1) { const g = el("button", "tc-greet", "Send greeting"); g.addEventListener("click", () => greet(t[0])); btns.appendChild(g); }
  c.replaceChildren(txt, btns);
  c.hidden = false;
}

function greeting(b) {
  if (b.days === 0) return `Happy birthday, ${b.name}! 🎂🎉 Wishing you a day filled with love, laughter, and everything you wished for. Enjoy your special day!`;
  if (b.days >= 335) return `Happy belated birthday, ${b.name}! 🎂 Hope you had a wonderful day, and here’s to a great year ahead!`;
  return `Happy early birthday, ${b.name}! 🎂🎈 Can’t wait to celebrate with you. Wishing you a wonderful year ahead!`;
}
async function greet(b) {
  const text = greeting(b);
  try { if (navigator.share) { await navigator.share({ text }); return; } }
  catch (e) { if (e.name === "AbortError") return; }
  try { await navigator.clipboard.writeText(text); toast("Greeting copied. Paste it in a message!"); }
  catch (e) { toast("Couldn’t copy the greeting. Please try again."); }
}

/* ---------- spotlight ---------- */
let spotList = [];
const grommets = () => ["g1", "g2", "g3", "g4"].map(c => el("i", "gr " + c));
const replay = t => { t.style.animation = "none"; void t.offsetWidth; t.style.animation = ""; };
function party() {
  const end = Date.now() + 3000;
  (function f() {
    confetti({ particleCount: 4, angle: 60, spread: 60, origin: { x: 0 }, zIndex: 2000 });
    confetti({ particleCount: 4, angle: 120, spread: 60, origin: { x: 1 }, zIndex: 2000 });
    if (Date.now() < end) requestAnimationFrame(f);
  })();
}
function balloons() {
  const s = $("spot");
  if (s.querySelector(".balloon")) return;
  for (let i = 0; i < 16; i++) {
    const b = el("span", "balloon", ["🎈", "🎈", "🎉", "🎊"][i % 4]);
    b.style.cssText = `--x:${Math.random() * 95}%;--d:${9 + Math.random() * 8}s;--w:${-Math.random() * 14}s;--s:${28 + Math.random() * 34}px`;
    s.prepend(b);
  }
}
function board() {
  const t = $("tarp"), grid = el("div", "tp-grid");
  t.replaceChildren(...grommets());
  spotList.forEach((b, i) => {
    const c = el("button", "tp-card");
    c.append(el("strong", null, b.name), el("span", null, `Turns ${b.turns}`));
    c.addEventListener("click", () => { slide(i); party(); });
    grid.appendChild(c);
  });
  t.append(el("div", "tp-script", "Happy Birthday!"), el("div", "tp-ribbon", "to all of today’s celebrants"), el("p", "tp-hint", "Click a name to see their birthday banner"), grid);
  replay(t);
}
function slide(i) {
  const b = spotList[i], t = $("tarp"), len = b.name.length, s = len <= 8 ? 15 : len <= 12 ? 11 : len <= 18 ? 8 : 6;
  t.replaceChildren(...grommets());
  const name = el("h2", "tp-name", b.name); name.style.fontSize = `${s}vmin`;
  const age = el("div", "tp-age"); age.append(el("b", null, String(b.turns)), el("small", null, "years old"));
  t.append(el("div", "tp-script", "Happy Birthday!"), name, age, el("div", "tp-ribbon", "Wishing you a day as special as you are!"), el("span", "tp-tag", b.tag));
  const acts = el("div", "tp-actions"), g = el("button", "tp-greet", "Send greeting");
  g.addEventListener("click", () => greet(b));
  acts.appendChild(g);
  if (spotList.length > 1) {
    const back = el("button", "tp-back", "← All celebrants");
    back.addEventListener("click", board);
    acts.appendChild(back);
  }
  t.appendChild(acts);
  replay(t);
}
function openSpot(list) {
  if (!list.length) return;
  spotList = list; balloons();
  if (list.length > 1) board(); else slide(0);
  $("spot").hidden = false; document.body.style.overflow = "hidden";
  $("spot-close").focus(); party();
}
function closeSpot() { $("spot").hidden = true; document.body.style.overflow = ""; }
$("spot-close").addEventListener("click", closeSpot);
$("spot-btn").addEventListener("click", () => {
  const all = compute(), today = all.filter(b => b.days === 0);
  if (today.length) return openSpot(today);
  const up = all.filter(b => b.days > 0);
  if (!up.length) return toast("No birthdays listed yet.");
  const min = Math.min(...up.map(b => b.days));
  openSpot(up.filter(b => b.days === min));
});
addEventListener("keydown", e => { if (e.key === "Escape" && !$("spot").hidden) closeSpot(); });

/* ---------- live data ---------- */
onSnapshot(col, snap => {
  items = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  render();
  if (firstLoad) {
    firstLoad = false;
    const all = compute();
    openSpot(all.filter(b => b.days === 0));
  }
}, () => { $("birthday-list").replaceChildren(el("div", "empty", "Couldn't load the list. Please try again later.")); });

/* ---------- tabs and filters ---------- */
function setTab(name) {
  tab = name;
  document.querySelectorAll(".tab").forEach(x => x.setAttribute("aria-selected", x.dataset.tab === name));
  render();
}
document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => setTab(t.dataset.tab)));
$("search").addEventListener("input", render);
$("tag-filter").addEventListener("change", render);

/* ---------- auth ---------- */
const syncHash = () => document.body.classList.toggle("show-auth", location.hash === "#admin");
syncHash(); addEventListener("hashchange", syncHash);
if (auth) onAuthStateChanged(auth, u => {
  document.body.classList.toggle("is-admin", !!u);
  $("auth-btn").textContent = u ? "Logout" : "Admin login";
  if (!u && tab === "all") setTab("month");
});
$("auth-btn").addEventListener("click", async () => {
  if (!auth) return toast("Login unavailable. Open the site over https (e.g. GitHub Pages), not from a file.");
  if (auth.currentUser) { await signOut(auth); return toast("Logged out."); }
  try { await signInWithPopup(auth, new GoogleAuthProvider()); toast("Logged in."); }
  catch (e) {
    if (e.code === "auth/popup-closed-by-user" || e.code === "auth/cancelled-popup-request") return;
    toast(e.code === "auth/unauthorized-domain" ? "Add this domain to Authorized domains in Firebase." : "Login failed. Please try again.");
  }
});

/* ---------- admin actions ---------- */
const guard = async fn => {
  try { await fn(); return true; }
  catch (e) { toast(e.code === "permission-denied" ? "No permission. Please log in first." : "Something went wrong. Please try again."); return false; }
};

$("add-btn").addEventListener("click", async () => {
  const name = $("nameInput").value.trim(), date = $("dateInput").value, tag = $("tagInput").value;
  if (!name || !date) return toast("Enter a name and date.");
  if (await guard(() => addDoc(col, { name, date, tag }))) {
    $("nameInput").value = ""; $("dateInput").value = "";
    confetti({ particleCount: 100, spread: 70, origin: { y: .6 }, colors: ["#ff6b9d", "#4a90e2", "#ffd700"] });
    toast("Added.");
  }
});

function openEdit(b) {
  editId = b.id; $("edit-name").value = b.name; $("edit-date").value = b.date; $("edit-tag").value = b.tag;
  $("edit-dialog").showModal();
}
$("edit-cancel").addEventListener("click", () => $("edit-dialog").close());
$("edit-form").addEventListener("submit", async e => {
  e.preventDefault();
  const name = $("edit-name").value.trim(), date = $("edit-date").value, tag = $("edit-tag").value;
  if (await guard(() => updateDoc(doc(db, "birthdays", editId), { name, date, tag }))) { $("edit-dialog").close(); toast("Saved."); }
});
async function remove(b) {
  if (confirm(`Delete ${b.name}?`) && await guard(() => deleteDoc(doc(db, "birthdays", b.id)))) toast("Deleted.");
}

/* ---------- theme ---------- */
const root = document.documentElement;
const dark = () => root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
const paintTheme = () => { $("theme-btn").textContent = dark() ? "☀️" : "🌙"; };
$("theme-btn").addEventListener("click", () => { const t = dark() ? "light" : "dark"; root.dataset.theme = t; ls.set("theme", t); paintTheme(); });
paintTheme();

</script>
</body>
</html>
